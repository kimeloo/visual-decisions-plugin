<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>decision-board</title>
  <link rel="stylesheet" href="/common.css" />
</head>
<body>
<main class="discuss">
  <h1>decision-board</h1>
  <p class="lead" id="msg">첫 페이지로 이동합니다…</p>
</main>
<script>
  fetch('/pages.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : {}))
    .then((config) => {
      const first = config.pages?.[0]?.href;
      if (first) location.replace(first);
      else document.getElementById('msg').textContent = 'public/pages.json에 페이지 목록이 없습니다.';
    })
    .catch(() => {
      document.getElementById('msg').textContent = 'public/pages.json을 읽지 못했습니다.';
    });
</script>
</body>
</html>
